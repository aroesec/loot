# This app holds financial data and a Plaid credential, so a known
# vulnerability in a transitive dependency matters more than the noise of
# keeping up. Security updates are ungrouped so they arrive on their own;
# everything else is batched monthly to keep the PR volume survivable for a
# small project.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      development:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native compiler rewrite, and Next.js 15 cannot use
      # it: `next build` dies with "Cannot read properties of undefined
      # (reading 'fileExists')" while `tsc --noEmit` and the tests both pass.
      # Revisit when Next supports it; the repo is otherwise ready, since
      # src/css.d.ts already fixes the one type error 7 raises.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Next major versions carry migrations of their own; take them by hand.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
